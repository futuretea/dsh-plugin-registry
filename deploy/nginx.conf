server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /index.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
    }

    location = /report.json {
        add_header Cache-Control "no-cache" always;
        default_type application/json;
    }

    location / {
        index index.html;
        add_header Cache-Control "no-cache" always;
    }
}
