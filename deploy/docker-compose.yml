# Internal DSH plugin market: a generator that re-verifies plugins on an interval,
# and nginx serving the generated static files. Runs on any host with Docker;
# does not need GitLab CI or GitLab Pages.
#
#   cp deploy/.env.example deploy/.env   # fill in GITLAB_URL / GITLAB_TOKEN ...
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

services:
  generator:
    build:
      context: ..
      args:
        GITLEAKS_BASE_URL: ${GITLEAKS_BASE_URL:-https://github.com/gitleaks/gitleaks/releases/download}
    restart: unless-stopped
    environment:
      GITLAB_URL: ${GITLAB_URL:?set GITLAB_URL}
      GITLAB_TOKEN: ${GITLAB_TOKEN:?set GITLAB_TOKEN}
      ALLOWLIST_GITLAB_PROJECT: ${ALLOWLIST_GITLAB_PROJECT:?set ALLOWLIST_GITLAB_PROJECT}
      ALLOWLIST_REF: ${ALLOWLIST_REF:-}
      DSH_PLUGIN_TOPIC: ${DSH_PLUGIN_TOPIC:-dsh-plugin}
      NPM_REGISTRY: ${NPM_REGISTRY:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-node:24-alpine}
      INDEX_MAX_RISK: ${INDEX_MAX_RISK:-medium}
      GENERATE_INTERVAL: ${GENERATE_INTERVAL:-21600}
    volumes:
      # The sandbox install runs `docker run` against the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - site:/site

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${MARKET_PORT:-8080}:80"
    volumes:
      - type: volume
        source: site
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  site:
